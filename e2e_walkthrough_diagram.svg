<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end confidential token walkthrough</title>
  <desc id="desc">Bank A registers A-USD, mints 100 units to Alice on Layer 1, shields them into Layer 2, Alice transfers 30 to Bob and keeps 70 as change, Bank A audits the output amounts, and Bob voluntarily forfeits 30 through unshield and redemption. Forced forfeiture is not supported.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 36px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane-title { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; letter-spacing: 0.04em; }
      .node-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .node-text { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .edge-label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .state { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .box { stroke-width: 2; rx: 16; filter: url(#shadow); }
      .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .edge-red { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>
  <text x="70" y="62" class="title">End-to-End Walkthrough: Mint → Shield → Transfer → Audit → Forfeit</text>
  <text x="70" y="96" class="subtitle">Example: Bank A issues 100 A-USD to Alice; Alice pays Bob 30 and keeps 70 as change.</text>

  <!-- Lane backgrounds -->
  <rect x="40" y="125" width="1720" height="150" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="40" y="295" width="1720" height="185" rx="20" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="40" y="500" width="1720" height="225" rx="20" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="40" y="745" width="1720" height="300" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="65" y="153" class="lane-title">SETUP</text>
  <text x="65" y="323" class="lane-title">LAYER 1 · ISSUANCE LEDGER</text>
  <text x="65" y="528" class="lane-title">LAYER 2 · SHARED SHIELDED POOL</text>
  <text x="65" y="773" class="lane-title">AUDIT AND RESOLUTION</text>

  <!-- Setup nodes -->
  <rect x="245" y="158" width="410" height="90" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="270" y="188" class="node-title">Bank A key setup</text>
  <text x="270" y="214" class="node-text">issuance_sk: mint / redeem authorization</text>
  <text x="270" y="237" class="node-text">audit_sk: read-only asset audit</text>

  <rect x="865" y="158" width="600" height="90" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="890" y="188" class="node-title">Register A-USD</text>
  <text x="890" y="214" class="node-text">Registry leaf: asset_id, audit_pk, issuance_pk, value_base</text>
  <text x="890" y="237" class="node-text">L2 later proves hidden membership under registry_root</text>

  <path d="M 655 203 L 865 203" class="edge"/>
  <text x="708" y="190" class="edge-label">sign and register</text>

  <!-- Layer 1 mint and shield -->
  <rect x="170" y="350" width="310" height="95" class="box" fill="#d1fae5" stroke="#10b981"/>
  <text x="195" y="382" class="node-title">1 · Mint 100 A-USD</text>
  <text x="195" y="409" class="node-text">Authorized by issuance_sk</text>
  <text x="195" y="432" class="node-text">Issuer records the event</text>

  <rect x="570" y="350" width="265" height="95" class="box" fill="#d1fae5" stroke="#10b981"/>
  <text x="595" y="382" class="node-title">Alice on L1</text>
  <text x="595" y="412" class="node-text">Encrypted balance = 100</text>

  <rect x="935" y="340" width="305" height="115" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="960" y="374" class="node-title">2 · C_shield proof</text>
  <text x="960" y="401" class="node-text">Debit L1 by 100</text>
  <text x="960" y="424" class="node-text">Create one L2 note</text>
  <text x="960" y="447" class="small">Amount and asset stay hidden</text>

  <rect x="1350" y="350" width="260" height="95" class="box" fill="#d1fae5" stroke="#10b981"/>
  <text x="1375" y="382" class="node-title">Alice after shield</text>
  <text x="1375" y="412" class="node-text">L1 balance = 0</text>

  <path d="M 480 398 L 570 398" class="edge"/>
  <path d="M 835 398 L 935 398" class="edge"/>
  <path d="M 1240 398 L 1350 398" class="edge"/>

  <!-- Layer 2 note and transfer -->
  <rect x="530" y="565" width="320" height="115" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="555" y="598" class="node-title">Alice note</text>
  <text x="555" y="625" class="node-text">Private value = 100</text>
  <text x="555" y="649" class="node-text">Public: cm₀ and auditor ct₀</text>
  <text x="555" y="671" class="small">Inserted into the shared Merkle tree</text>

  <rect x="955" y="550" width="330" height="145" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="980" y="582" class="node-title">3 · C_transfer proof</text>
  <text x="980" y="609" class="node-text">Consume Alice's note; publish nf₀</text>
  <text x="980" y="633" class="node-text">Prove: 100 + 0 = 30 + 70</text>
  <text x="980" y="657" class="node-text">Create two new cm / auditor ct pairs</text>
  <text x="980" y="681" class="small">Asset, values, owners remain private</text>

  <rect x="1420" y="535" width="270" height="78" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1445" y="567" class="node-title">Bob note</text>
  <text x="1445" y="594" class="node-text">Private value = 30</text>

  <rect x="1420" y="630" width="270" height="78" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1445" y="662" class="node-title">Alice change</text>
  <text x="1445" y="689" class="node-text">Private value = 70</text>

  <path d="M 1088 455 C 1088 510, 690 500, 690 565" class="edge"/>
  <text x="770" y="513" class="edge-label">commit note</text>
  <path d="M 850 622 L 955 622" class="edge"/>
  <path d="M 1285 604 C 1340 604, 1340 574, 1420 574" class="edge"/>
  <path d="M 1285 642 C 1340 642, 1340 669, 1420 669" class="edge"/>

  <!-- Audit -->
  <rect x="170" y="810" width="500" height="145" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195" y="844" class="node-title">4 · Bank A audit</text>
  <text x="195" y="873" class="node-text">Scan public output ciphertexts</text>
  <text x="195" y="899" class="node-text">ct₂ − audit_sk · ct₁ → recover 30 and 70</text>
  <text x="195" y="925" class="node-text">Cannot identify owners or spend the notes</text>
  <text x="195" y="948" class="small">audit_sk grants visibility, not control</text>

  <path d="M 1080 695 C 1080 770, 670 760, 670 845" class="edge-dashed"/>
  <text x="765" y="770" class="edge-label">auditor ciphertexts</text>
  <path d="M 450 248 C 450 520, 310 620, 310 810" class="edge-dashed"/>
  <text x="325" y="740" class="edge-label">audit_sk</text>

  <!-- Voluntary forfeiture -->
  <rect x="760" y="800" width="265" height="105" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="785" y="833" class="node-title">5 · Voluntary forfeit</text>
  <text x="785" y="861" class="node-text">Bob authorizes with ask</text>
  <text x="785" y="885" class="node-text">C_unshield consumes 30</text>

  <rect x="1095" y="800" width="260" height="105" class="box" fill="#d1fae5" stroke="#10b981"/>
  <text x="1120" y="833" class="node-title">L1 treasury</text>
  <text x="1120" y="861" class="node-text">Encrypted credit = 30</text>
  <text x="1120" y="885" class="small">L2 now holds 70</text>

  <rect x="1425" y="800" width="265" height="105" class="box" fill="#d1fae5" stroke="#10b981"/>
  <text x="1450" y="833" class="node-title">6 · Redeem / burn</text>
  <text x="1450" y="861" class="node-text">Burn 30 on L1</text>
  <text x="1450" y="885" class="node-text">Net supply = 70</text>

  <path d="M 1535 613 C 1535 735, 893 700, 893 800" class="edge"/>
  <text x="1110" y="744" class="edge-label">Bob chooses to surrender 30</text>
  <path d="M 1025 853 L 1095 853" class="edge"/>
  <path d="M 1355 853 L 1425 853" class="edge"/>

  <!-- Unsupported forced forfeiture -->
  <rect x="760" y="935" width="930" height="82" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="785" y="968" class="node-title">Forced forfeiture is not supported by the current protocol</text>
  <text x="785" y="995" class="node-text">Bank A lacks Bob's ask and note opening; there is no C_forfeit circuit or forced-spend nullifier path.</text>
  <path d="M 1555 613 C 1715 680, 1715 930, 1690 961" class="edge-red"/>

  <!-- State summary -->
  <rect x="170" y="1066" width="1460" height="34" rx="10" fill="#e2e8f0"/>
  <text x="205" y="1089" class="state">Supply: mint 100 → shield 100 → transfer 30 + 70 → voluntary unshield 30 → burn 30 → 70 remains in L2</text>
</svg>
